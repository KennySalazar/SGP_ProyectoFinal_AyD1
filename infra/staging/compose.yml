name: sgp-staging

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  backend:
    image: ${BACKEND_IMAGE:?BACKEND_IMAGE is required}
    environment:
      SPRING_PROFILES_ACTIVE: staging
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      DATABASE_USERNAME: ${DATABASE_USERNAME:?DATABASE_USERNAME is required}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:?DATABASE_PASSWORD is required}
      MIGRATION_DATABASE_USERNAME: ${MIGRATION_DATABASE_USERNAME:?MIGRATION_DATABASE_USERNAME is required}
      MIGRATION_DATABASE_PASSWORD: ${MIGRATION_DATABASE_PASSWORD:?MIGRATION_DATABASE_PASSWORD is required}
      SECRET_KEY_JWT: ${SECRET_KEY_JWT:?SECRET_KEY_JWT is required}
      ACCESS_EXPIRATION_TIME_JWT: ${ACCESS_EXPIRATION_TIME_JWT:-900000}
      REFRESH_EXPIRATION_TIME_JWT: ${REFRESH_EXPIRATION_TIME_JWT:-604800000}
      INITIAL_ADMIN_EMAIL: ${INITIAL_ADMIN_EMAIL:?INITIAL_ADMIN_EMAIL is required}
      INITIAL_ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD:?INITIAL_ADMIN_PASSWORD is required}
      MAIL_HOST: ${MAIL_HOST:?MAIL_HOST is required}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:?MAIL_USERNAME is required}
      MAIL_PASSWORD: ${MAIL_PASSWORD:?MAIL_PASSWORD is required}
      MAIL_FROM: ${MAIL_FROM:?MAIL_FROM is required}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-SGP CUNOC - Staging}
      OTP_LENGTH: ${OTP_LENGTH:-6}
      OTP_EXPIRATION_MINUTES: ${OTP_EXPIRATION_MINUTES:-10}
      OTP_MAX_ATTEMPTS: ${OTP_MAX_ATTEMPTS:-5}
      OTP_RESEND_COOLDOWN_SECONDS: ${OTP_RESEND_COOLDOWN_SECONDS:-60}
      INVITACION_VIGENCIA_HORAS: ${INVITACION_VIGENCIA_HORAS:-72}
      INVITACION_URL_ACTIVACION: ${INVITACION_URL_ACTIVACION:-http://localhost:8088/activar-cuenta}
      REFRESH_COOKIE_SECURE: "false"
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:8088}
      OPENAPI_PUBLIC: "false"
      JAVA_TOOL_OPTIONS: ${JAVA_TOOL_OPTIONS:--XX:MaxRAMPercentage=65 -XX:InitialRAMPercentage=20 -Djava.security.egd=file:/dev/urandom}
    networks:
      - proxy
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    init: true
    restart: unless-stopped
    stop_grace_period: 30s
    mem_limit: 448m
    pids_limit: 300
    logging: *default-logging

  nginx:
    image: ${FRONTEND_IMAGE:?FRONTEND_IMAGE is required}
    ports:
      - "127.0.0.1:${STAGING_HTTP_PORT:-8088}:8080"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - proxy
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    init: true
    restart: unless-stopped
    stop_grace_period: 10s
    mem_limit: 64m
    pids_limit: 100
    logging: *default-logging

networks:
  proxy:
    name: sgp_staging_proxy
