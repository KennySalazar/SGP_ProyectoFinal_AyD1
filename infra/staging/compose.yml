name: sgp-staging

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  postgres:
    image: postgis/postgis:16-3.5
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_MIGRATOR_USER:?POSTGRES_MIGRATOR_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_MIGRATOR_PASSWORD:?POSTGRES_MIGRATOR_PASSWORD is required}
      SGP_APP_USER: ${POSTGRES_APP_USER:?POSTGRES_APP_USER is required}
      SGP_APP_PASSWORD: ${POSTGRES_APP_PASSWORD:?POSTGRES_APP_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../postgres/init:/docker-entrypoint-initdb.d:ro
    networks:
      - data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped
    stop_grace_period: 30s
    mem_limit: 256m
    pids_limit: 200
    logging: *default-logging

  minio:
    # Silo mantiene compatibilidad con MinIO; la imagen oficial ya no admite pulls anonimos.
    image: docker.io/pgsty/silo:RELEASE.2026-09-16T00-00-00Z@sha256:635197cb9f36d01bee221d34d1c7d7960f6a95c48b0b6c01d99cd13bdae51a46
    command: server /data
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
      MINIO_BROWSER: "off"
    volumes:
      - minio_data:/data
    networks:
      - data
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://127.0.0.1:9000/minio/health/live"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped
    stop_grace_period: 30s
    mem_limit: 256m
    pids_limit: 200
    logging: *default-logging

  backend:
    image: ${BACKEND_IMAGE:?BACKEND_IMAGE is required}
    environment:
      SPRING_PROFILES_ACTIVE: staging
      DATABASE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:?POSTGRES_DB is required}
      DATABASE_USERNAME: ${POSTGRES_APP_USER:?POSTGRES_APP_USER is required}
      DATABASE_PASSWORD: ${POSTGRES_APP_PASSWORD:?POSTGRES_APP_PASSWORD is required}
      MIGRATION_DATABASE_USERNAME: ${POSTGRES_MIGRATOR_USER:?POSTGRES_MIGRATOR_USER is required}
      MIGRATION_DATABASE_PASSWORD: ${POSTGRES_MIGRATOR_PASSWORD:?POSTGRES_MIGRATOR_PASSWORD is required}
      SECRET_KEY_JWT: ${SECRET_KEY_JWT:?SECRET_KEY_JWT is required}
      ACCESS_EXPIRATION_TIME_JWT: ${ACCESS_EXPIRATION_TIME_JWT:-900000}
      REFRESH_EXPIRATION_TIME_JWT: ${REFRESH_EXPIRATION_TIME_JWT:-604800000}
      INITIAL_ADMIN_EMAIL: ${INITIAL_ADMIN_EMAIL:?INITIAL_ADMIN_EMAIL is required}
      INITIAL_ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD:?INITIAL_ADMIN_PASSWORD is required}
      MAIL_HOST: ${MAIL_HOST:?MAIL_HOST is required}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:?MAIL_USERNAME is required}
      MAIL_PASSWORD: ${MAIL_PASSWORD:?MAIL_PASSWORD is required}
      MAIL_FROM: ${MAIL_FROM:?MAIL_FROM is required}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-SGP CUNOC - Staging}
      OTP_LENGTH: ${OTP_LENGTH:-6}
      OTP_EXPIRATION_MINUTES: ${OTP_EXPIRATION_MINUTES:-10}
      OTP_MAX_ATTEMPTS: ${OTP_MAX_ATTEMPTS:-5}
      OTP_RESEND_COOLDOWN_SECONDS: ${OTP_RESEND_COOLDOWN_SECONDS:-60}
      INVITACION_VIGENCIA_HORAS: ${INVITACION_VIGENCIA_HORAS:-72}
      INVITACION_URL_ACTIVACION: ${INVITACION_URL_ACTIVACION:-http://localhost:8088/activar-cuenta}
      REFRESH_COOKIE_SECURE: "false"
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:8088}
      OPENAPI_PUBLIC: "false"
      JAVA_TOOL_OPTIONS: ${JAVA_TOOL_OPTIONS:--XX:MaxRAMPercentage=65 -XX:InitialRAMPercentage=20 -Djava.security.egd=file:/dev/urandom}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - proxy
      - data
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    init: true
    restart: unless-stopped
    stop_grace_period: 30s
    mem_limit: 448m
    pids_limit: 300
    logging: *default-logging

  nginx:
    image: ${FRONTEND_IMAGE:?FRONTEND_IMAGE is required}
    ports:
      - "127.0.0.1:${STAGING_HTTP_PORT:-8088}:8080"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - proxy
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    init: true
    restart: unless-stopped
    stop_grace_period: 10s
    mem_limit: 64m
    pids_limit: 100
    logging: *default-logging

volumes:
  postgres_data:
    name: sgp_staging_postgres_data
  minio_data:
    name: sgp_staging_minio_data

networks:
  proxy:
    name: sgp_staging_proxy
  data:
    name: sgp_staging_data
    internal: true
