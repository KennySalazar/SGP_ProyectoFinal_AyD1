<app-auth-card title="Recuperar contrasena" subtitle="Solicita un codigo temporal para restablecer tu acceso.">
  <form [formGroup]="form" (ngSubmit)="submit()">
    <label>Correo electronico<input pInputText type="email" formControlName="email" autocomplete="email" placeholder="nombre@correo.com" /></label>
    <button pButton class="primary" type="submit" [disabled]="form.invalid"><i class="pi pi-send"></i><span>Enviar codigo</span></button>
  </form>
  @if(sent()){
    <p class="note"><i class="pi pi-envelope"></i> Si el correo esta registrado, recibira un codigo de recuperacion.</p>
    <div class="links"><a routerLink="/recuperar/restablecer" [queryParams]="{email: form.controls.email.value}">Ya tengo el codigo</a></div>
  }
  <div class="links"><a routerLink="/login">Volver al inicio de sesion</a></div>
</app-auth-card>
