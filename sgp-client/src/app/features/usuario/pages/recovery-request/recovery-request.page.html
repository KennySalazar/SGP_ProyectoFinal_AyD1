<app-auth-card
  [title]="'auth.recovery.title' | transloco"
  [subtitle]="'auth.recovery.subtitle' | transloco"
>
  <form [formGroup]="form" (ngSubmit)="submit()">
    <label
      >{{ 'common.email' | transloco }}<input
        pInputText
        type="email"
        formControlName="email"
        autocomplete="email"
        [placeholder]="'common.emailPlaceholder' | transloco"
    /></label>
    <button pButton class="primary" type="submit" [disabled]="form.invalid || enviando()">
      <i class="pi pi-send"></i
      ><span>{{ (enviando() ? 'auth.recovery.sending' : 'auth.recovery.send') | transloco }}</span>
    </button>
  </form>
  <div class="links"><a routerLink="/login">{{ 'auth.recovery.back' | transloco }}</a></div>
</app-auth-card>
