<app-auth-card title="Crear cuenta" subtitle="El autorregistro crea una cuenta de Estudiante pendiente de activacion por un Catedratico.">
  <form [formGroup]="form" (ngSubmit)="submit()">
    <label>Correo electronico<input pInputText type="email" formControlName="email" autocomplete="email" placeholder="nombre@correo.com" /></label>
    <label>Contrasena<input pInputText type="password" formControlName="password" autocomplete="new-password" placeholder="Minimo 10 caracteres" /></label>
    <p class="note"><i class="pi pi-info-circle"></i> Minimo 10 caracteres, con al menos una letra y un numero.</p>
    <button pButton class="primary" type="submit" [disabled]="form.invalid"><i class="pi pi-user-plus"></i><span>Crear cuenta</span></button>
  </form>
  <div class="links"><a routerLink="/login">Ya tengo cuenta</a></div>
</app-auth-card>
