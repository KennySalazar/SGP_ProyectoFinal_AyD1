<app-auth-card
  [title]="'auth.register.title' | transloco"
  [subtitle]="'auth.register.subtitle' | transloco"
>
  <form [formGroup]="form" (ngSubmit)="submit()">
    <label
      >{{ 'common.email' | transloco }}<input
        pInputText
        type="email"
        formControlName="email"
        autocomplete="email"
        [placeholder]="'common.emailPlaceholder' | transloco"
    /></label>
    <label
      >{{ 'common.password' | transloco }}<input
        pInputText
        type="password"
        formControlName="password"
        autocomplete="new-password"
        [placeholder]="'common.minPasswordPlaceholder' | transloco"
    /></label>
    <p class="note"><i class="pi pi-info-circle"></i> {{ 'auth.register.rule' | transloco }}</p>
    <button pButton class="primary" type="submit" [disabled]="form.invalid">
      <i class="pi pi-user-plus"></i><span>{{ 'auth.register.title' | transloco }}</span>
    </button>
  </form>
  <div class="links"><a routerLink="/login">{{ 'auth.register.haveAccount' | transloco }}</a></div>
</app-auth-card>
