<app-auth-card title="Verificacion en dos pasos" subtitle="Ingresa el codigo de 6 digitos enviado a tu correo.">
  <form [formGroup]="form" (ngSubmit)="submit()">
    <label>Codigo OTP<input pInputText class="otp-input" inputmode="numeric" maxlength="6" formControlName="code" autocomplete="one-time-code" placeholder="000000" /></label>
    <button pButton class="primary" type="submit" [disabled]="form.invalid"><i class="pi pi-verified"></i><span>Verificar codigo</span></button>
  </form>
  <p class="note"><i class="pi pi-clock"></i> Usa el codigo mas reciente recibido en tu correo.</p>
</app-auth-card>
