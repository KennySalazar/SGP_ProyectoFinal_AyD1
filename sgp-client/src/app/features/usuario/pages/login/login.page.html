<app-auth-card
  [title]="'auth.login.title' | transloco"
  [subtitle]="'auth.login.subtitle' | transloco"
>
  <form [formGroup]="form" (ngSubmit)="submit()">
    <label>
      {{ 'common.email' | transloco }}
      <span class="input-wrap"
        ><i class="pi pi-envelope"></i
        ><input
          pInputText
          type="email"
          formControlName="email"
          autocomplete="email"
          [placeholder]="'common.emailPlaceholder' | transloco"
      /></span>
    </label>
    <label>
      {{ 'common.password' | transloco }}
      <span class="input-wrap"
        ><i class="pi pi-key"></i
        ><input
          pInputText
          type="password"
          formControlName="password"
          autocomplete="current-password"
          [placeholder]="'common.passwordPlaceholder' | transloco"
      /></span>
    </label>
    <button pButton class="primary" type="submit" [disabled]="form.invalid">
      <i class="pi pi-sign-in"></i><span>{{ 'common.continue' | transloco }}</span>
    </button>
  </form>
  <div class="links">
    <a routerLink="/registro">{{ 'auth.register.title' | transloco }}</a
    ><a routerLink="/recuperar">{{ 'auth.login.forgot' | transloco }}</a>
  </div>
</app-auth-card>
