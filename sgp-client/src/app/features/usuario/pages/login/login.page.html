<app-auth-card title="Iniciar sesion" subtitle="Accede con tu cuenta del Sistema de Gestion de Puentes.">
  <form [formGroup]="form" (ngSubmit)="submit()">
    <label>
      Correo electronico
      <span class="input-wrap"><i class="pi pi-envelope"></i><input pInputText type="email" formControlName="email" autocomplete="email" placeholder="nombre@correo.com" /></span>
    </label>
    <label>
      Contrasena
      <span class="input-wrap"><i class="pi pi-key"></i><input pInputText type="password" formControlName="password" autocomplete="current-password" placeholder="Ingresa tu contrasena" /></span>
    </label>
    <button pButton class="primary" type="submit" [disabled]="form.invalid"><i class="pi pi-sign-in"></i><span>Continuar</span></button>
  </form>
  <div class="links"><a routerLink="/registro">Crear cuenta</a><a routerLink="/recuperar">Olvide mi contrasena</a></div>
</app-auth-card>
