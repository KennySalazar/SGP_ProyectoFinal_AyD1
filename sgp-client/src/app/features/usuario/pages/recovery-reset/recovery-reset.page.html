<app-auth-card
  [title]="'auth.reset.title' | transloco"
  [subtitle]="'auth.reset.subtitle' | transloco"
>
  @if(done()){
  <p class="note success">
    <i class="pi pi-check-circle"></i> {{ 'auth.reset.success' | transloco }}
  </p>
  <div class="links"><a routerLink="/login">{{ 'auth.login.title' | transloco }}</a></div>
  } @else {
  <form [formGroup]="form" (ngSubmit)="submit()">
    <label
      >{{ 'common.emailShort' | transloco }}<input
        pInputText
        type="email"
        formControlName="email"
        autocomplete="email"
    /></label>
    <label
      >{{ 'common.otpCode' | transloco }}<input
        pInputText
        class="otp-input"
        inputmode="numeric"
        maxlength="6"
        formControlName="otp"
        placeholder="000000"
    /></label>
    <label
      >{{ 'common.newPassword' | transloco }}<input
        pInputText
        type="password"
        formControlName="newPassword"
        autocomplete="new-password"
        [placeholder]="'common.minPasswordPlaceholder' | transloco"
    /></label>
    <button pButton class="primary" type="submit" [disabled]="form.invalid">
      <i class="pi pi-key"></i><span>{{ 'auth.reset.action' | transloco }}</span>
    </button>
  </form>
  }
</app-auth-card>
