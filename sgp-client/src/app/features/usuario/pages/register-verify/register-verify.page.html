<app-auth-card title="Verificar correo" subtitle="Confirma tu direccion de correo con el codigo recibido.">
  @if(done()){
    <p class="note success"><i class="pi pi-check-circle"></i> Correo verificado. Tu cuenta queda pendiente de activacion por un Catedratico.</p>
    <div class="links"><a routerLink="/login">Volver al inicio de sesion</a></div>
  } @else {
    <form [formGroup]="form" (ngSubmit)="submit()">
      <label>Codigo OTP<input pInputText class="otp-input" inputmode="numeric" maxlength="6" formControlName="code" autocomplete="one-time-code" placeholder="000000" /></label>
      <button pButton class="primary" type="submit" [disabled]="form.invalid"><i class="pi pi-check"></i><span>Verificar correo</span></button>
    </form>
  }
</app-auth-card>
