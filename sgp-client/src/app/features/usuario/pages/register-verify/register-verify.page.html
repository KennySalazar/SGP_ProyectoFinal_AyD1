<app-auth-card
  [title]="'auth.verifyRegistration.title' | transloco"
  [subtitle]="'auth.verifyRegistration.subtitle' | transloco"
>
  @if(done()){
  <p class="note success">
    <i class="pi pi-check-circle"></i> {{ 'auth.verifyRegistration.success' | transloco }}
  </p>
  <div class="links"><a routerLink="/login">{{ 'auth.recovery.back' | transloco }}</a></div>
  } @else {
  <form [formGroup]="form" (ngSubmit)="submit()">
    <label
      >{{ 'common.otpCode' | transloco }}<input
        pInputText
        class="otp-input"
        inputmode="numeric"
        maxlength="6"
        formControlName="code"
        autocomplete="one-time-code"
        placeholder="000000"
    /></label>
    <button pButton class="primary" type="submit" [disabled]="form.invalid">
      <i class="pi pi-check"></i><span>{{ 'auth.verifyRegistration.action' | transloco }}</span>
    </button>
  </form>
  }
</app-auth-card>
