services:
  postgres:
    image: postgis/postgis:16-3.5
    environment:
      POSTGRES_DB: sgp_db
      POSTGRES_USER: sgp_migrator
      POSTGRES_PASSWORD: sgp_migrator_password
      SGP_APP_USER: sgp_user
      SGP_APP_PASSWORD: sgp_password
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sgp_migrator -d sgp_db"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  minio:
    image: quay.io/minio/minio:RELEASE.2025-07-23T15-54-02Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: sgp_minio
      MINIO_ROOT_PASSWORD: sgp_minio_local_password
    ports:
      - "127.0.0.1:19000:9000"
      - "127.0.0.1:19001:9001"
    volumes:
      - minio_data:/data
    restart: unless-stopped

  backend:
    build:
      context: ./sgp-api
      dockerfile: Dockerfile
    env_file:
      - ./sgp-api/.env
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/sgp_db
      DATABASE_USERNAME: sgp_user
      DATABASE_PASSWORD: sgp_password
      MIGRATION_DATABASE_USERNAME: sgp_migrator
      MIGRATION_DATABASE_PASSWORD: sgp_migrator_password
      REFRESH_COOKIE_SECURE: "false"
      CORS_ALLOWED_ORIGINS: http://localhost:8088
      OPENAPI_PUBLIC: "true"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  nginx:
    build:
      context: ./sgp-client
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:8088:8080"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
  minio_data:
