name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [develop]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Backend tests
        working-directory: sgp-api
        run: mvn -B spotless:check verify

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install
        working-directory: sgp-client
        run: npm ci --no-audit --no-fund
      - name: Lint
        working-directory: sgp-client
        run: npm run lint
      - name: Format check
        working-directory: sgp-client
        run: npm run format:check
      - name: Build
        working-directory: sgp-client
        run: npm run build
