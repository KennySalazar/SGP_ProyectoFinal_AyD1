name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [develop]

permissions:
  contents: read

env:
  API_IMAGE: ghcr.io/kennysalazar/sgp-api
  CLIENT_IMAGE: ghcr.io/kennysalazar/sgp-client

jobs:
  backend:
    name: Validate backend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: sgp-api/pom.xml
          verify-signature: true

      - name: Run backend checks
        working-directory: sgp-api
        run: mvn -B spotless:check verify

  frontend:
    name: Validate frontend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: sgp-client/package-lock.json

      - name: Install dependencies
        working-directory: sgp-client
        run: npm ci --no-audit --no-fund

      - name: Run lint
        working-directory: sgp-client
        run: npm run lint

      - name: Check formatting
        working-directory: sgp-client
        run: npm run format:check

      - name: Build frontend
        working-directory: sgp-client
        run: npm run build

  publish-backend:
    name: Publish backend image
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    concurrency:
      group: ghcr-sgp-api-develop
      cancel-in-progress: false
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      published: ${{ steps.current.outputs.publish }}
    steps:
      - name: Confirm current develop revision
        id: current
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          latest_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/develop" --jq '.object.sha')"
          if [[ "${latest_sha}" == "${GITHUB_SHA}" ]]; then
            echo "publish=true" >>"${GITHUB_OUTPUT}"
          else
            echo "publish=false" >>"${GITHUB_OUTPUT}"
            echo "::notice::A newer develop revision exists; skipping this image publication."
          fi

      - name: Checkout repository
        if: steps.current.outputs.publish == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        if: steps.current.outputs.publish == 'true'
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to GHCR
        if: steps.current.outputs.publish == 'true'
        uses: docker/login-action@b45d80f862d83dbcd57f89517bcf500b2ab88fb2 # v4.0.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish backend
        if: steps.current.outputs.publish == 'true'
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./sgp-api
          file: ./sgp-api/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.API_IMAGE }}:sha-${{ github.sha }}
            ${{ env.API_IMAGE }}:develop
          build-args: |
            BUILD_DATE=${{ github.event.head_commit.timestamp }}
            VCS_REF=${{ github.sha }}
            VERSION=sha-${{ github.sha }}
          cache-from: type=gha,scope=sgp-api
          cache-to: type=gha,mode=max,scope=sgp-api
          provenance: mode=max
          sbom: true

  publish-frontend:
    name: Publish frontend image
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    concurrency:
      group: ghcr-sgp-client-develop
      cancel-in-progress: false
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      published: ${{ steps.current.outputs.publish }}
    steps:
      - name: Confirm current develop revision
        id: current
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          latest_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/develop" --jq '.object.sha')"
          if [[ "${latest_sha}" == "${GITHUB_SHA}" ]]; then
            echo "publish=true" >>"${GITHUB_OUTPUT}"
          else
            echo "publish=false" >>"${GITHUB_OUTPUT}"
            echo "::notice::A newer develop revision exists; skipping this image publication."
          fi

      - name: Checkout repository
        if: steps.current.outputs.publish == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        if: steps.current.outputs.publish == 'true'
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to GHCR
        if: steps.current.outputs.publish == 'true'
        uses: docker/login-action@b45d80f862d83dbcd57f89517bcf500b2ab88fb2 # v4.0.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish frontend
        if: steps.current.outputs.publish == 'true'
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./sgp-client
          file: ./sgp-client/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.CLIENT_IMAGE }}:sha-${{ github.sha }}
            ${{ env.CLIENT_IMAGE }}:develop
          build-args: |
            BUILD_DATE=${{ github.event.head_commit.timestamp }}
            VCS_REF=${{ github.sha }}
            VERSION=sha-${{ github.sha }}
          cache-from: type=gha,scope=sgp-client
          cache-to: type=gha,mode=max,scope=sgp-client
          provenance: mode=max
          sbom: true

  deploy-staging:
    name: Deploy staging
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/develop' &&
      vars.STAGING_ENABLED == 'true' &&
      needs.publish-backend.outputs.published == 'true' &&
      needs.publish-frontend.outputs.published == 'true'
    needs: [publish-backend, publish-frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: staging
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: sgp-staging-deploy
      cancel-in-progress: false
    steps:
      - name: Confirm current develop revision
        id: current
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          latest_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/develop" --jq '.object.sha')"
          if [[ "${latest_sha}" == "${GITHUB_SHA}" ]]; then
            echo "deploy=true" >>"${GITHUB_OUTPUT}"
          else
            echo "deploy=false" >>"${GITHUB_OUTPUT}"
            echo "::notice::A newer develop revision exists; skipping this staging deployment."
          fi

      - name: Validate staging variables
        if: steps.current.outputs.deploy == 'true'
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
          AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
          STAGING_INSTANCE_ID: ${{ vars.STAGING_INSTANCE_ID }}
        run: |
          for variable in AWS_REGION AWS_ROLE_ARN STAGING_INSTANCE_ID; do
            if [[ -z "${!variable}" ]]; then
              echo "::error::Missing required staging variable: ${variable}"
              exit 1
            fi
          done

      - name: Checkout deployment files
        if: steps.current.outputs.deploy == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Configure temporary AWS credentials
        if: steps.current.outputs.deploy == 'true'
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: sgp-staging-${{ github.run_id }}
          mask-aws-account-id: true

      - name: Send deployment through Systems Manager
        if: steps.current.outputs.deploy == 'true'
        id: send-command
        env:
          STAGING_INSTANCE_ID: ${{ vars.STAGING_INSTANCE_ID }}
          BACKEND_IMAGE: ${{ env.API_IMAGE }}@${{ needs.publish-backend.outputs.digest }}
          FRONTEND_IMAGE: ${{ env.CLIENT_IMAGE }}@${{ needs.publish-frontend.outputs.digest }}
        run: |
          compose_b64="$(base64 --wrap=0 infra/staging/compose.yml)"
          deploy_b64="$(base64 --wrap=0 infra/staging/deploy.sh)"
          postgres_init_b64="$(base64 --wrap=0 infra/postgres/init/00-create-app-user.sh)"

          parameters="$(jq --null-input \
            --arg compose "${compose_b64}" \
            --arg deploy "${deploy_b64}" \
            --arg postgres_init "${postgres_init_b64}" \
            --arg backend "${BACKEND_IMAGE}" \
            --arg frontend "${FRONTEND_IMAGE}" \
            --arg revision "${GITHUB_SHA}" \
            '{commands: [
              "set -eu",
              "install -d -m 0755 /opt/sgp/staging /opt/sgp/postgres/init",
              ("printf %s " + ($compose | @sh) + " | base64 --decode > /opt/sgp/staging/compose.candidate.yml"),
              ("printf %s " + ($deploy | @sh) + " | base64 --decode > /opt/sgp/staging/deploy.sh"),
              ("printf %s " + ($postgres_init | @sh) + " | base64 --decode > /opt/sgp/postgres/init/00-create-app-user.sh"),
              "chmod 0755 /opt/sgp/staging/deploy.sh /opt/sgp/postgres/init/00-create-app-user.sh",
              ("/opt/sgp/staging/deploy.sh /opt/sgp/staging/compose.candidate.yml " + ($backend | @sh) + " " + ($frontend | @sh) + " " + ($revision | @sh))
            ]}')"

          command_id="$(aws ssm send-command \
            --document-name AWS-RunShellScript \
            --instance-ids "${STAGING_INSTANCE_ID}" \
            --comment "SGP staging ${GITHUB_SHA}" \
            --timeout-seconds 900 \
            --parameters "${parameters}" \
            --query 'Command.CommandId' \
            --output text)"

          echo "command_id=${command_id}" >>"${GITHUB_OUTPUT}"
          echo "SSM command sent: ${command_id}"

      - name: Wait for deployment result
        if: steps.current.outputs.deploy == 'true'
        env:
          COMMAND_ID: ${{ steps.send-command.outputs.command_id }}
          STAGING_INSTANCE_ID: ${{ vars.STAGING_INSTANCE_ID }}
        run: |
          deadline=$((SECONDS + 900))
          while (( SECONDS < deadline )); do
            if ! invocation="$(aws ssm get-command-invocation \
              --command-id "${COMMAND_ID}" \
              --instance-id "${STAGING_INSTANCE_ID}" \
              --output json 2>&1)"; then
              if [[ "${invocation}" == *InvocationDoesNotExist* ]]; then
                sleep 5
                continue
              fi
              echo "${invocation}" >&2
              exit 1
            fi
            status="$(jq --raw-output '.Status' <<<"${invocation}")"

            case "${status}" in
              Pending|InProgress|Delayed)
                sleep 5
                ;;
              Success)
                jq --raw-output '.StandardOutputContent' <<<"${invocation}"
                exit 0
                ;;
              *)
                jq --raw-output '.StandardOutputContent' <<<"${invocation}"
                jq --raw-output '.StandardErrorContent' <<<"${invocation}" >&2
                echo "::error::Staging deployment finished with status ${status}."
                exit 1
                ;;
            esac
          done

          aws ssm cancel-command --command-id "${COMMAND_ID}" >/dev/null
          echo "::error::Staging deployment exceeded the 15-minute timeout."
          exit 1
