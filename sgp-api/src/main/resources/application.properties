
spring.config.import=optional:file:.env[.properties]
spring.application.name=sgp-api
server.port=8090

spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.flyway.enabled=true
spring.flyway.url=${DATABASE_URL}
spring.flyway.user=${MIGRATION_DATABASE_USERNAME}
spring.flyway.password=${MIGRATION_DATABASE_PASSWORD}
spring.flyway.locations=classpath:db/migration

spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
app.mail.from=${MAIL_FROM:${MAIL_USERNAME}}

security.jwt.secret-key=${SECRET_KEY_JWT}
security.jwt.access-expiration-ms=${ACCESS_EXPIRATION_TIME_JWT:900000}
security.jwt.refresh-expiration-ms=${REFRESH_EXPIRATION_TIME_JWT:604800000}

security.otp.length=${OTP_LENGTH:6}
security.otp.expiration-minutes=${OTP_EXPIRATION_MINUTES:10}
security.otp.max-attempts=${OTP_MAX_ATTEMPTS:5}
security.otp.resend-cooldown-seconds=${OTP_RESEND_COOLDOWN_SECONDS:60}

security.refresh-cookie.name=SGP_REFRESH_TOKEN
security.refresh-cookie.secure=${REFRESH_COOKIE_SECURE:false}
security.refresh-cookie.same-site=Strict

app.bootstrap.admin.email=${INITIAL_ADMIN_EMAIL}
app.bootstrap.admin.initial-password=${INITIAL_ADMIN_PASSWORD}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}
app.openapi.public=${OPENAPI_PUBLIC:true}

spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=25MB

springdoc.api-docs.path=/api/docs
springdoc.swagger-ui.path=/swagger-ui.html

management.endpoints.web.exposure.include=health,metrics
management.endpoint.health.show-details=never
management.health.mail.enabled=false
